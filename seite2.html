<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Meine Deutsche Profilseite</title>
    <style>
        :root{
            --accent: #ffffff;
            --muted: rgba(255,255,255,0.85);
            --glass: rgba(255,255,255,0.06);
            --glass-strong: rgba(0,0,0,0.5);
            --radius: 18px;
            font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        }

        /* Seite / Video */
        html,body{height:100%;margin:0;background:#000;color:var(--accent);}
        .video-wrap{
            position:fixed;inset:0;overflow:hidden;z-index:0;
            display:flex;align-items:center;justify-content:center;
        }
        .video-wrap video{
            min-width:100%;min-height:100%;object-fit:cover;filter:brightness(0.55) saturate(1.05);
        }

        /* dunkle overlay um text lesbar zu machen */
        .overlay{
            position:fixed;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 80%);z-index:1;
        }

        /* Container für Inhalt */
        .container{
            position:relative;z-index:2;max-width:900px;margin:40px auto;padding:28px;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center;
        }

        /* settings gear top-right */
        .gear{
            position:fixed;top:18px;right:18px;z-index:5;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));backdrop-filter:blur(6px);cursor:pointer;
            box-shadow:0 6px 18px rgba(0,0,0,0.45);
        }
        .gear svg{width:24px;height:24px;fill:var(--accent);opacity:0.95}

        /* Profil-Karte */
        .card{
            width:100%;max-width:760px;padding:22px;border-radius:20px;background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
            box-shadow:0 8px 40px rgba(0,0,0,0.6);backdrop-filter:blur(6px);
            display:flex;flex-direction:column;align-items:center;gap:14px;
        }

        .avatar{
            width:86px;height:86px;border-radius:16px;overflow:hidden;border:2px solid rgba(255,255,255,0.12);
            display:flex;align-items:center;justify-content:center;background:var(--glass);
        }
        .avatar img{width:100%;height:100%;object-fit:cover;display:block}

        .name{font-size:36px;font-weight:700;letter-spacing:0.6px;color:var(--accent);text-shadow:0 6px 30px rgba(0,0,0,0.6);}
        .diamond{width:34px;height:34px;margin-top:-6px;opacity:0.95}

        .bio{font-size:18px;color:var(--muted);max-width:80%;line-height:1.4}
        .meta-row{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:15px}

        /* Social icons */
        .icons{display:flex;gap:14px;margin-top:8px}
        .icons a{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--accent);box-shadow:0 6px 20px rgba(0,0,0,0.45)}

        /* großer Button (Roblox) */
        .big-button{
            margin-top:12px;padding:12px 22px;border-radius:40px;background:rgba(255,255,255,0.06);display:inline-flex;align-items:center;gap:12px;color:var(--accent);min-width:240px;justify-content:center;font-weight:600;border:1px solid rgba(255,255,255,0.03);
        }
        .big-button img{width:36px;height:36px;border-radius:8px;object-fit:cover}

        .views{position:absolute;left:20px;bottom:18px;color:var(--muted);display:flex;gap:8px;align-items:center;z-index:3}

        /* Modernes Einstellungen Modal */
        .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:10}
        .modal{width:92%;max-width:760px;background:linear-gradient(180deg,#0b0b0b,#0f0f10);border-radius:14px;padding:20px;color:var(--muted);box-shadow:0 14px 60px rgba(0,0,0,0.7)}
        .modal-header{display:flex;justify-content:center;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid rgba(255,255,255,0.1)}
        .modal h2{color:var(--accent);margin:0;font-size:24px;font-weight:600}
        
        .form-row{display:flex;gap:15px;margin-bottom:15px;flex-wrap:wrap}
        .form-group{flex:1;min-width:250px}
        .form-group label{display:block;margin-bottom:8px;font-size:14px;font-weight:500;color:var(--muted)}
        
        .input-wrapper{position:relative;display:flex;align-items:center}
        .input-icon{position:absolute;left:12px;color:var(--muted);z-index:1}
        .input-field{width:100%;padding:12px 12px 12px 40px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:var(--accent);font-size:14px;transition:all 0.2s}
        .input-field:focus{outline:none;border-color:rgba(255,255,255,0.3);background:rgba(255,255,255,0.08)}
        
        .form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:15px;border-top:1px solid rgba(255,255,255,0.1)}
        .btn{padding:10px 20px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:14px;transition:all 0.2s}
        .btn.primary{background:#2e7dff;color:#fff}
        .btn.primary:hover{background:#1a6de8}
        .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.1);color:var(--muted)}
        .btn.ghost:hover{background:rgba(255,255,255,0.05)}
        
        .password-wrapper{position:relative;width:100%}
        .password-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;z-index:2}

        /* Checkliste */
        .checklist {
            list-style: none;
            padding: 0;
            margin: 15px 0;
            text-align: left;
            width: 100%;
            max-width: 300px;
        }
        
        .checklist li {
            margin: 10px 0;
            display: flex;
            align-items: center;
            font-size: 16px;
        }
        
        .checklist input[type="checkbox"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
        }
        
        .checklist .checked {
            color: #4CAF50;
        }
        
        .checklist .unchecked {
            color: var(--muted);
        }
        
        .emoji {
            margin-left: 8px;
            font-size: 18px;
        }

        /* responsive tweaks */
        @media (max-width:520px){
            .name{font-size:28px}
            .bio{font-size:15px}
            .avatar{width:74px;height:74px}
            .gear{width:46px;height:46px}
            .form-group{min-width:100%}
        }
    </style>
</head>
<body>

<!-- video hintergrund -->
<div class="video-wrap" aria-hidden="true">
    <!-- Standard-Videolink: ersetze durch eigene MP4/WebM URL oder lokales File -->
    <video id="bgVideo" autoplay muted loop playsinline>
        <source src="https://cdn.pixabay.com/vimeo/393803141/party-37325.mp4?width=1280&hash=..." type="video/mp4">
        <!-- Falls Nutzer kein Video hat: Poster-Image -->
    </video>
</div>
<div class="overlay" aria-hidden="true"></div>

<!-- Settings Gear (oben rechts) -->
<div class="gear" id="openSettings" title="Einstellungen">
    <!-- Zahnrad-SVG -->
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19.14,12.94c0.04-0.31,0.06-0.63,0.06-0.94s-0.02-0.63-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61l-1.92-3.32c-0.11-0.2-0.35-0.28-0.56-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.5,2.81c-0.03-0.22-0.22-0.38-0.44-0.38h-3.13c-0.22,0-0.41,0.16-0.44,0.38L9.02,4.49c-0.59,0.24-1.12,0.56-1.62,0.94L5.01,4.47c-0.21-0.08-0.45,0.02-0.56,0.22L2.53,8.01c-0.11,0.2-0.06,0.47,0.12,0.61L4.68,10.2C4.63,10.51,4.61,10.83,4.61,11.14s0.02,0.63,0.06,0.94L2.64,13.66c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.11,0.2,0.35,0.28,0.56,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.37,1.68c0.03,0.22,0.22,0.38,0.44,0.38h3.13c0.22,0,0.41-0.16,0.44-0.38l0.37-1.68c0.59-0.24,1.12-0.56,1.62-0.94l2.39,0.96c0.21,0.08,0.45-0.02,0.56-0.22l1.92-3.32c0.11-0.2,0.06-0.47-0.12-0.61L19.14,12.94zM12,15.6c-1.98,0-3.6-1.62-3.6-3.6s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
</div>

<!-- Hauptcontainer -->
<div class="container">
    <div class="card" id="profileCard">
        <div class="avatar" id="avatarWrap">
            <img id="avatarImg" src="https://i.ibb.co/9cX7s0X/avatar-placeholder.png" alt="Avatar">
        </div>

        <div style="display:flex;align-items:center;gap:12px;flex-direction:column">
            <div class="diamond" aria-hidden="true">
                <!-- kleines Diamant-SVG -->
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="white" opacity="0.95"/></svg>
            </div>
            <div class="name" id="displayName">Colin</div>
            <div class="bio" id="bioText">Willkommen auf meiner Seite. Hier findest du alles über:</div>
            
            <!-- Checkliste -->
            <ul class="checklist">
                <li>
                    <input type="checkbox" id="item1" checked disabled>
                    <label for="item1" class="checked">Deutschland</label>
                </li>
                <li>
                    <input type="checkbox" id="item2" checked disabled>
                    <label for="item2" class="checked">💬 💮 💯</label>
                </li>
            </ul>
            
            <div class="meta-row"><span id="location">Deutschland</span></div>
        </div>

        <div class="icons" id="socialIcons">
            <!-- einfache Platzhalter-Icons (TikTok, Roblox, Discord, RobloxSquare) -->
            <a href="#" title="TikTok" data-key="tiktok" aria-label="TikTok">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M16 4h2v6a4 4 0 1 1-4-4h2V4z" fill="white" /></svg>
            </a>
            <a href="#" title="Roblox" data-key="roblox" aria-label="Roblox">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect width="20" height="20" x="2" y="2" rx="4" fill="white" transform="rotate(18 12 12)"/></svg>
            </a>
            <a href="#" title="Discord" data-key="discord" aria-label="Discord">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M8 9.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm8 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z" fill="white" /></svg>
            </a>
        </div>

        <div class="big-button" id="ctaButton" role="button" tabindex="0">
            <img src="https://i.ibb.co/0F7t9g2/roblox-icon.png" alt="Roblox">
            <span id="ctaLabel">Roblox</span>
        </div>

        <div style="position:relative;width:100%;height:8px"></div>
    </div>
</div>

<!-- views -->
<div class="views" aria-hidden="true">
    <svg width="18" height="12" viewBox="0 0 24 24" fill="none" style="opacity:0.9"><path d="M12 5c-7 0-11 7-11 7s4 7 11 7 11-7 11-7-4-7-11-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z" fill="white"/></svg>
    <div id="viewCount">6</div>
</div>

<!-- Modernes Einstellungen Modal -->
<div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="modal-header">
            <h2 id="settingsTitle">Einstellungen</h2>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Seiten-Pseudonym (Name)</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                    </span>
                    <input type="text" id="inName" placeholder="z.B. Colin" class="input-field">
                </div>
            </div>

            <div class="form-group">
                <label>Standort</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/>
                        </svg>
                    </span>
                    <input type="text" id="inLocation" placeholder="Deutschland" class="input-field">
                </div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Beschreibung (Bio)</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
                        </svg>
                    </span>
                    <input type="text" id="inBio" placeholder="Willkommen auf meiner Seite..." class="input-field">
                </div>
            </div>

            <div class="form-group">
                <label>CTA-Text</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 6h-3v2h3c.55 0 1 .45 1 1s-.45 1-1 1h-3v2h3c.55 0 1 .45 1 1s-.45 1-1 1h-4c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h4c.55 0 1 .45 1 1s-.45 1-1 1z"/>
                        </svg>
                    </span>
                    <input type="text" id="inCTA" placeholder="Roblox" class="input-field">
                </div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Avatar Image URL</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
                        </svg>
                    </span>
                    <input type="text" id="inAvatar" placeholder="https://..." class="input-field">
                </div>
            </div>

            <div class="form-group">
                <label>Hintergrund Video URL</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
                        </svg>
                    </span>
                    <input type="text" id="inVideo" placeholder="https://your-video.mp4" class="input-field">
                </div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Social Icons anzeigen?</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/>
                        </svg>
                    </span>
                    <select id="inShowIcons" class="input-field">
                        <option value="1">Ja</option>
                        <option value="0">Nein</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>View Count</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                    </span>
                    <input type="text" id="inViews" placeholder="6" class="input-field">
                </div>
            </div>
        </div>

        <div class="form-actions">
            <div style="font-size:13px;color:rgba(255,255,255,0.6);flex:1">Passwort zum Öffnen: <strong>110121</strong></div>
            <button class="btn ghost" id="btnReset">Zurücksetzen</button>
            <button class="btn primary" id="btnSave">Speichern</button>
            <button class="btn ghost" id="btnClose">Schließen</button>
        </div>
    </div>
</div>

<script>
/*
  Einstellungen: Passwort geschützt (vom Nutzer angegeben)
  Passwort (statisch): 110121
*/
const SETTINGS_PASSWORD = "110121";

/* DOM-Elemente */
const gear = document.getElementById('openSettings');
const modal = document.getElementById('modalBackdrop');
const btnClose = document.getElementById('btnClose');
const btnSave = document.getElementById('btnSave');
const btnReset = document.getElementById('btnReset');

const displayName = document.getElementById('displayName');
const bioText = document.getElementById('bioText');
const locationEl = document.getElementById('location');
const avatarImg = document.getElementById('avatarImg');
const bgVideo = document.getElementById('bgVideo');
const socialIcons = document.getElementById('socialIcons');
const ctaLabel = document.getElementById('ctaLabel');
const viewCountEl = document.getElementById('viewCount');

const inName = document.getElementById('inName');
const inBio = document.getElementById('inBio');
const inLocation = document.getElementById('inLocation');
const inAvatar = document.getElementById('inAvatar');
const inVideo = document.getElementById('inVideo');
const inShowIcons = document.getElementById('inShowIcons');
const inCTA = document.getElementById('inCTA');
const inViews = document.getElementById('inViews');

/* Default-Einstellungen */
const defaultSettings = {
    name: "Colin",
    bio: "Willkommen auf meiner Seite. Hier findest du alles über:",
    location: "Deutschland",
    avatar: "https://i.ibb.co/9cX7s0X/avatar-placeholder.png",
    video: bgVideo.querySelector('source') ? bgVideo.querySelector('source').src : "",
    showIcons: true,
    cta: "Roblox",
    views: "6"
};

/* Läd Einstellungen aus localStorage */
function loadSettings(){
    let s = localStorage.getItem('profileSettings');
    if(!s){
        s = JSON.stringify(defaultSettings);
        localStorage.setItem('profileSettings', s);
    }
    const settings = JSON.parse(s);
    applySettingsToUI(settings);
    fillSettingsForm(settings);
}

/* Überträgt Settings auf sichtbare Seite */
function applySettingsToUI(settings){
    displayName.textContent = settings.name || "";
    bioText.textContent = settings.bio || "";
    locationEl.textContent = settings.location || "";
    avatarImg.src = settings.avatar || defaultSettings.avatar;
    ctaLabel.textContent = settings.cta || "Roblox";
    viewCountEl.textContent = settings.views || "0";
    if(settings.video){
        // Tausche Video-Source
        const src = settings.video;
        if(bgVideo.querySelector('source')){
            bgVideo.querySelector('source').src = src;
            bgVideo.load();
            bgVideo.play().catch(()=>{});
        } else {
            const s = document.createElement('source');
            s.src = src; s.type = "video/mp4";
            bgVideo.appendChild(s);
            bgVideo.load(); bgVideo.play().catch(()=>{});
        }
    }
    socialIcons.style.display = settings.showIcons ? "flex" : "none";
}

/* Füllt das Formular mit aktuellen Settings */
function fillSettingsForm(settings){
    inName.value = settings.name || "";
    inBio.value = settings.bio || "";
    inLocation.value = settings.location || "";
    inAvatar.value = settings.avatar || "";
    inVideo.value = settings.video || "";
    inShowIcons.value = settings.showIcons ? "1":"0";
    inCTA.value = settings.cta || "Roblox";
    inViews.value = settings.views || "0";
}

/* Öffnen der Einstellungen - erst Passwort abfragen */
gear.addEventListener('click', async () => {
    const pw = prompt("Bitte Passwort eingeben, um Einstellungen zu öffnen:");
    if(pw === null) return; // abgebrochen
    if(pw === SETTINGS_PASSWORD){
        // korrekt -> modal öffnen
        modal.style.display = "flex";
        modal.setAttribute('aria-hidden','false');
    } else {
        alert("Falsches Passwort.");
    }
});

/* Schliessen */
btnClose.addEventListener('click', ()=>{ modal.style.display = "none"; modal.setAttribute('aria-hidden','true'); });

/* Speichern */
btnSave.addEventListener('click', () => {
    const settings = {
        name: inName.value || defaultSettings.name,
        bio: inBio.value || defaultSettings.bio,
        location: inLocation.value || defaultSettings.location,
        avatar: inAvatar.value || defaultSettings.avatar,
        video: inVideo.value || defaultSettings.video,
        showIcons: inShowIcons.value === "1",
        cta: inCTA.value || defaultSettings.cta,
        views: inViews.value || defaultSettings.views
    };
    localStorage.setItem('profileSettings', JSON.stringify(settings));
    applySettingsToUI(settings);
    modal.style.display = "none";
    modal.setAttribute('aria-hidden','true');
});

/* Reset auf Standard */
btnReset.addEventListener('click', ()=>{
    if(!confirm("Auf Standard-Einstellungen zurücksetzen?")) return;
    localStorage.removeItem('profileSettings');
    loadSettings();
    alert("Zurückgesetzt.");
});

/* Klick auf CTA (nur Demo) */
document.getElementById('ctaButton').addEventListener('click', ()=>{
    alert("CTA gedrückt – hier könntest du z.B. zu Roblox oder einem externen Link weiterleiten.");
});

/* Init */
loadSettings();

/* Optional: Escape-Taste schließt Modal */
window.addEventListener('keydown', (e)=>{
    if(e.key === "Escape" && modal.style.display === "flex"){
        modal.style.display = "none";modal.setAttribute('aria-hidden','true');
    }
});
</script>
</body>
</html>
